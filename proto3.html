<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Spelldial · 시연판</title>
    <script type="module" crossorigin src="./assets/proto3-B_HV7zh5.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/700-54RcnS5h.js">
    <link rel="stylesheet" crossorigin href="./assets/700-BsM5XIEu.css">
    <link rel="stylesheet" crossorigin href="./assets/proto3-BgyNBqzS.css">
  </head>
  <body>
    <div id="p3">
      <!-- 처음 화면: 문 둘 -->
      <section id="p3-title-screen">
        <h1 id="p3-title"></h1>
        <p id="p3-sub"></p>
        <p id="p3-intro"></p>
        <div id="p3-doors">
          <button id="p3-door-hunt" class="door"><b></b><span></span></button>
          <button id="p3-door-quest" class="door" disabled><b></b><span></span></button>
        </div>
      </section>

      <!-- 전투 화면: 화면 전체가 전장 -->
      <section id="p3-battle" hidden>
        <canvas id="p3-world"></canvas>
        <header id="p3-hud">
          <span id="p3-hp"></span>
          <span id="p3-lv"><b id="p3-level"></b><span id="p3-xp"><i id="p3-xp-fill"></i></span></span>
          <span id="p3-time"></span>
        </header>
        <p id="p3-todo"><b id="p3-todo-label"></b> <span id="p3-todo-text"></span></p>
        <div id="p3-corner">
          <button id="p3-open-editor"></button>
          <span class="sep"></span>
          <span id="p3-speed"></span>
          <span class="sep"></span>
          <button id="p3-sound"></button>
        </div>

        <!-- 주문 수정 창: 바깥 전장이 둘레로 보인다 -->
        <div id="p3-editor" hidden>
          <header class="ed-head">
            <h2 id="p3-ed-title"></h2>
            <span id="p3-ed-state"></span>
            <button id="p3-ed-help">?</button>
            <button id="p3-ed-close"></button>
          </header>
          <div class="ed-body">
            <section id="p3-side">
              <div class="p3-grp">
                <h3 id="p3-h-tools"></h3>
                <div class="p3-btns p3-tools" id="p3-tools"></div>
              </div>
              <div class="p3-grp">
                <h3 id="p3-h-sym"></h3>
                <div class="p3-btns" id="p3-sym"></div>
              </div>
              <div class="p3-grp">
                <h3 id="p3-h-edit"></h3>
                <div class="p3-btns" id="p3-edit"></div>
              </div>
              <div class="p3-grp" id="p3-info">
                <h3 id="p3-h-pattern"></h3>
                <div class="p3-box" id="p3-pattern-box"><canvas id="p3-pattern-canvas"></canvas></div>
                <p id="p3-pattern-text"></p>
                <p id="p3-pattern-before"></p>
              </div>
            </section>
            <section id="p3-main">
              <div class="p3-box" id="p3-astro-box"><canvas id="p3-astro-canvas"></canvas></div>
              <div class="p3-ex-row">
                <h3 id="p3-h-examples"></h3>
                <div class="p3-btns" id="p3-examples"></div>
              </div>
            </section>
          </div>
          <!-- "?"를 누르면 펼쳐지는 규칙 다섯 줄 -->
          <div id="p3-rules" hidden>
            <h3 id="p3-rules-title"></h3>
            <ol id="p3-rules-list"></ol>
          </div>
        </div>
        <p id="p3-toast" hidden></p>

        <!-- 레벨업: 세상이 멈추고 셋 중 하나 -->
        <div id="p3-levelup" class="p3-modal" hidden>
          <h2 id="p3-lu-title"></h2>
          <p id="p3-lu-sub"></p>
          <div id="p3-lu-choices"></div>
        </div>

        <!-- 쓰러짐 / 5분 버팀 -->
        <div id="p3-end" class="p3-modal" hidden>
          <h2 id="p3-end-title"></h2>
          <p id="p3-end-stats"></p>
          <p id="p3-end-sub"></p>
          <div id="p3-end-btns"></div>
        </div>
      </section>
    </div>

  </body>
</html>
