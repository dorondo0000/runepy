<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Spelldial · 시연판</title>
    <script type="module" crossorigin src="./assets/proto3-DncUMd-q.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/700-54RcnS5h.js">
    <link rel="stylesheet" crossorigin href="./assets/700-BsM5XIEu.css">
    <link rel="stylesheet" crossorigin href="./assets/proto3-Dnv59Ory.css">
  </head>
  <body>
    <div id="p3">
      <!-- 처음 화면: 문 셋 (연습장이 맨 앞) -->
      <section id="p3-title-screen">
        <h1 id="p3-title"></h1>
        <p id="p3-sub"></p>
        <p id="p3-intro"></p>
        <div id="p3-doors">
          <button id="p3-door-practice" class="door"><b></b><span></span></button>
          <button id="p3-door-quest" class="door"><b></b><span></span></button>
          <button id="p3-door-hunt" class="door"><b></b><span></span></button>
        </div>
        <p id="p3-purse"></p>
      </section>

      <!-- 전장 화면: 사냥, 연습장, 의뢰 작업대가 함께 쓴다 (class mode-hunt / mode-practice / mode-orders) -->
      <section id="p3-battle" hidden>
        <canvas id="p3-world"></canvas>
        <!-- 사냥: 체력, 레벨, 남은 시간 -->
        <header id="p3-hud">
          <span id="p3-hp"></span>
          <span id="p3-lv"><b id="p3-level"></b><span id="p3-xp"><i id="p3-xp-fill"></i></span></span>
          <span id="p3-time"></span>
        </header>
        <!-- 연습장: 이름, 안내, 처음 화면 -->
        <header id="p3-pr-head" hidden>
          <h2 id="p3-pr-title"></h2>
          <span id="p3-pr-note"></span>
          <button id="p3-pr-back"></button>
        </header>
        <!-- 의뢰: 위쪽 띠에 계산대와 손님, 말풍선, 확인할 것 -->
        <header id="p3-ord-band" hidden>
          <div id="p3-counter-box"><canvas id="p3-counter"></canvas></div>
          <div id="p3-bubble">
            <div class="say">
              <p class="who"><b id="p3-ord-who"></b><span id="p3-ord-progress"></span><span id="p3-ord-purse"></span></p>
              <p id="p3-ord-words"></p>
            </div>
            <div id="p3-ord-talk">
              <button id="p3-ord-again"></button>
              <button id="p3-ord-next" hidden></button>
              <button id="p3-ord-back"></button>
            </div>
          </div>
          <div id="p3-ord-checks">
            <div class="row">
              <h3 id="p3-h-checks"></h3>
              <span id="p3-ord-hidden"></span>
              <span class="grow"></span>
              <button id="p3-ord-test"></button>
              <button id="p3-ord-deliver"></button>
              <button id="p3-ord-skip"></button>
            </div>
            <ul id="p3-ord-list"></ul>
          </div>
        </header>
        <p id="p3-todo"><b id="p3-todo-label"></b> <span id="p3-todo-text"></span></p>
        <div id="p3-corner">
          <button id="p3-open-editor"></button>
          <span class="sep"></span>
          <span id="p3-speed"></span>
          <span class="sep"></span>
          <button id="p3-sound"></button>
        </div>

        <!-- 주문 수정 창: 바깥 전장이 둘레로 보인다 -->
        <div id="p3-editor" hidden>
          <header class="ed-head">
            <h2 id="p3-ed-title"></h2>
            <span id="p3-ed-state"></span>
            <button id="p3-ed-help">?</button>
            <button id="p3-ed-close"></button>
          </header>
          <div class="ed-body">
            <section id="p3-side">
              <div class="p3-grp">
                <h3 id="p3-h-tools"></h3>
                <div class="p3-btns p3-tools" id="p3-tools"></div>
              </div>
              <div class="p3-grp">
                <h3 id="p3-h-sym"></h3>
                <div class="p3-btns" id="p3-sym"></div>
              </div>
              <div class="p3-grp">
                <h3 id="p3-h-edit"></h3>
                <div class="p3-btns" id="p3-edit"></div>
              </div>
              <!-- 발사 결과: 미리보기에서 최근에 쏘거나 흩어진 것 세 줄 -->
              <!-- 본보기: 4.2판 3절에 따라 천문반 아래에서 옆 띠로 옮겨 천문반을 키운다 -->
              <div class="p3-grp p3-ex-row">
                <h3 id="p3-h-examples"></h3>
                <div class="p3-btns" id="p3-examples"></div>
              </div>
              <!-- 발사 결과: 미리보기에서 최근에 쏘거나 흩어진 것 세 줄 (한 줄씩) -->
              <div class="p3-grp" id="p3-info">
                <h3 id="p3-h-results"></h3>
                <ol id="p3-results"></ol>
              </div>
            </section>
            <section id="p3-main">
              <div class="p3-box" id="p3-astro-box"><canvas id="p3-astro-canvas"></canvas></div>
              <!-- 한 칸씩 보기: 멈춤 / 한 칸, 가장 앞선 구슬의 상태 한 줄 -->
              <div class="p3-step-row">
                <button id="p3-pause"></button>
                <button id="p3-step"></button>
                <b id="p3-orb-label"></b>
                <span id="p3-orb-line"></span>
              </div>
            </section>
          </div>
          <!-- "?"를 누르면 펼쳐지는 규칙 다섯 줄 -->
          <div id="p3-rules" hidden>
            <h3 id="p3-rules-title"></h3>
            <ol id="p3-rules-list"></ol>
            <ul id="p3-rune-list"></ul>
          </div>
        </div>
        <p id="p3-toast" hidden></p>

        <!-- 레벨업: 세상이 멈추고 셋 중 하나 -->
        <div id="p3-levelup" class="p3-modal" hidden>
          <h2 id="p3-lu-title"></h2>
          <p id="p3-lu-sub"></p>
          <div id="p3-lu-choices"></div>
        </div>

        <!-- 쓰러짐 / 5분 버팀 -->
        <div id="p3-end" class="p3-modal" hidden>
          <h2 id="p3-end-title"></h2>
          <p id="p3-end-stats"></p>
          <p id="p3-end-sub"></p>
          <div id="p3-end-btns"></div>
        </div>

        <!-- 의뢰: 하루 정산 -->
        <div id="p3-ord-end" class="p3-modal" hidden>
          <h2 id="p3-ord-end-title"></h2>
          <p id="p3-ord-end-total"></p>
          <ol id="p3-ord-end-list"></ol>
          <div id="p3-ord-end-btns"></div>
        </div>
      </section>
    </div>

  </body>
</html>
