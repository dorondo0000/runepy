<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Rune.py · 마법진 시연판</title>
    <script type="module" crossorigin src="./assets/proto3-DSCK258J.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/700-54RcnS5h.js">
    <link rel="stylesheet" crossorigin href="./assets/700-BsM5XIEu.css">
    <link rel="stylesheet" crossorigin href="./assets/proto3-B3b10jR8.css">
  </head>
  <body>
    <div id="p3">
      <header id="p3-top">
        <h1><span id="p3-title"></span> <small id="p3-sub"></small></h1>
        <p id="p3-todo"><b id="p3-todo-label"></b> <span id="p3-todo-text"></span></p>
      </header>

      <section id="p3-side">
        <div class="p3-grp" id="p3-tools-grp">
          <h2 id="p3-h-tools"></h2>
          <div class="p3-btns p3-tools" id="p3-tools"></div>
        </div>
        <div class="p3-grp">
          <h2 id="p3-h-sym"></h2>
          <div class="p3-btns" id="p3-sym"></div>
        </div>
        <div class="p3-grp">
          <h2 id="p3-h-edit"></h2>
          <div class="p3-btns" id="p3-edit"></div>
        </div>
        <div class="p3-grp" id="p3-examples-grp">
          <h2 id="p3-h-examples"></h2>
          <div class="p3-btns p3-examples" id="p3-examples"></div>
        </div>
        <details id="p3-rules" open>
          <summary id="p3-rules-title"></summary>
          <ol id="p3-rules-list"></ol>
        </details>
      </section>

      <section id="p3-astro">
        <h2 id="p3-h-astro"></h2>
        <div class="p3-box" id="p3-astro-box"><canvas id="p3-astro-canvas"></canvas></div>
        <p id="p3-measure"></p>
      </section>

      <section id="p3-field">
        <h2 id="p3-h-field"></h2>
        <div class="p3-box" id="p3-field-box"><canvas id="p3-field-canvas"></canvas></div>
        <div id="p3-wave">
          <p id="p3-wave-info"></p>
          <p id="p3-wave-next"></p>
          <div class="p3-btns" id="p3-run"></div>
        </div>
      </section>
    </div>

  </body>
</html>
