<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rune.py</title>
    <script type="module" crossorigin src="./assets/proto5-BDZvIyXA.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/700-54RcnS5h.js">
    <link rel="modulepreload" crossorigin href="./assets/dist-CfPhYAhd.js">
    <link rel="modulepreload" crossorigin href="./assets/gate-Ckwe1_lH.js">
    <link rel="stylesheet" crossorigin href="./assets/700-BsM5XIEu.css">
    <link rel="stylesheet" crossorigin href="./assets/proto5-BnI9O-lE.css">
  </head>
  <body>
    <div id="p5">
      <!-- 게임 세계: 캔버스 하나가 늘 화면 전체(전투·시험장) -->
      <canvas id="world"></canvas>
      <!-- 판이 떠 있을 때 뒤 세계를 어둡게(비네팅), 준비에서는 마도서 쪽만 그늘 -->
      <div id="shade"></div>
      <div id="bookshade"></div>
      <!-- 마도서·문서가 열려 세계가 멈춘 동안 가장자리 비네팅(불투명도 = 정지 진행도) -->
      <div id="freeze"></div>

      <!-- 전투 위 글: 웨이브 끝·쓰러짐 쪽지(왼쪽 아래 키캡 줄 #keyrow는 keyRow.ts가 만든다) -->
      <p id="banner" class="px-frame" hidden></p>

      <!-- 제목(v10): 바닥에 비스듬히 깔린 대마법진 + 빛기둥 + 마법사 + 해독 렌즈(titleCircle.ts), 위에 상자 없는 로고, 맨 아래 가로 메뉴 -->
      <section id="title-screen" hidden>
        <canvas id="title-bg"></canvas>
        <h1 id="logo"><span class="rune" id="logo-rune"></span><span class="py" id="logo-py"></span></h1>
        <nav id="menu"><div class="side left"></div><div class="mid"></div><div class="side right"></div></nav>
      </section>

      <!-- 거점(v17): 제목과 다른 장소처럼 화면 전체를 쓰는 별도 화면. 뒤는 실제 전투 바닥(어둡게, 느리게 흐름),
           윗줄 나무 띠(야영지 · 탭 셋 · 설정 · 제목으로), 가운데 탭 내용(화면 전체 너비), 아랫줄(키 안내 · 요약 · 출전) -->
      <section id="hub-screen" hidden>
        <canvas id="hub-bg"></canvas>
        <header id="hub-top">
          <div id="hub-name"><canvas id="hub-fire" class="px" width="16" height="16"></canvas><span id="hub-name-label"></span></div>
          <nav id="hub-tabs" role="tablist"></nav>
          <div id="hub-tools">
            <button id="hub-settings" class="btn-wood" data-tip="설정"><span class="gear" aria-hidden="true"></span><span id="hub-settings-label"></span></button>
            <button id="hub-back" class="btn-wood"><span id="hub-back-label"></span><kbd>Esc</kbd></button>
          </div>
        </header>
        <main id="hub-main"><div id="hub-body"></div></main>
        <footer id="hub-bottom">
          <p id="hub-keys"></p>
          <div id="hub-go-wrap">
            <div id="hub-go-text"><p id="hub-summary"></p><p id="hub-go-note"></p></div>
            <button id="hub-go" class="btn-seal" data-snd="press"><span id="hub-go-label"></span><kbd>Enter</kbd></button>
          </div>
        </footer>
      </section>

      <!-- 출전 전환(v17): 화면이 하얗게 0.3초 덮였다가 전투가 열린다 -->
      <div id="flash" hidden></div>

      <!-- 출전 직후 목표 안내(v16 6절): 화면 위 가운데 2.5초. v18: 양끝이 갈라진 픽셀 리본 -->
      <div id="goal" class="px-ribbon" hidden><b id="goal-text"></b><span id="goal-sub"></span></div>
      <!-- v22 전장 변이 배지: 출전 리본 아래 한 줄 -->
      <div id="goal-mut" hidden><canvas id="goal-mut-icon" width="18" height="18"></canvas><b id="goal-mut-name"></b><span id="goal-mut-desc"></span></div>

      <!-- 증강 카드: 멈춘 전투 위에 큰 카드 세 장(고를 차례가 둘 이상이면 아래 점) -->
      <section id="cards-screen" hidden>
        <ol id="offer-list" class="cards"></ol>
        <p id="offer-dots" hidden></p>
      </section>

      <!-- 전투 중 파편 해금 등 짧은 알림 띠(화면 위) -->
      <p id="alert" class="px-frame" hidden></p>

      <!-- 마도서(v12, v25-B 배치): 전투 중 Tab으로 연다·닫는다. 열려 있는 동안 세계는 멈춘다. 고친 술식은 0.4초 뒤 이 전투에 걸린다.
           기본은 오른쪽 대칭 — [왼쪽: 1.4× 시전자+마법진] [가운데 오른쪽: 코드(위 책갈피 탭)] [바깥 끝: Docs | 보조 코드, 접기].
           설정 "배치"로 좌우를 뒤집는다(#p5.side-left). 책갈피 탭 = 마도서 칸(고치면 자동 저장) -->
      <section id="grimoire" hidden>
        <div id="book-wrap" class="lift">
          <nav id="book-tabs" role="tablist"></nav>
          <section id="book" class="sheet px-frame">
            <i class="brass tl" aria-hidden="true"></i><i class="brass tr" aria-hidden="true"></i><i class="brass bl" aria-hidden="true"></i><i class="brass br" aria-hidden="true"></i>
            <i id="book-ribbon" aria-hidden="true"></i>
            <div class="bookhead">
              <div class="bookrow">
                <h2 id="book-title"></h2><span id="status"></span><span class="grow"></span>
                <button id="skin-toggle" class="btn-icon sm" hidden><span id="skin-toggle-icon" aria-hidden="true"></span></button>
                <button id="book-close" class="btn-wood sm"><span id="book-close-label"></span><kbd id="book-close-key"></kbd></button>
              </div>
              <div class="bookrow" id="preset-row"><span id="preset-title" class="small"></span><span id="presets"></span></div>
            </div>
            <div id="band" hidden><p id="band-line"><span id="band-text"></span><span class="grow"></span><span id="band-tag"></span><kbd id="band-key" hidden></kbd></p><button id="band-ex" hidden></button></div>
            <div id="ed-wrap">
              <div id="ed"></div>
            </div>
            <div id="meter"><span id="meter-bar"><i></i></span><b id="meter-label"></b><span id="meter-note"></span></div>
            <div id="err"><p id="err-what"></p><p id="err-why"></p><p id="err-fix"></p></div>
          </section>
        </div>
      </section>

      <!-- 바깥 판(v25-B): 마도서의 바깥 끝에 붙는 Docs | 보조 코드. 접으면 얇은 책등 탭만(#docs-spine) -->
      <div id="docs-win" class="lift" hidden>
        <section id="docs" class="sheet px-frame">
          <div class="docshead">
            <nav id="outer-mode" role="tablist"><button id="mode-docs" class="btn-wood sm" role="tab"></button><button id="mode-aux" class="btn-wood sm" role="tab"></button></nav>
            <span class="grow"></span><button id="docs-close" class="btn-icon sm"></button>
          </div>
          <input id="docs-search" type="search" autocomplete="off" spellcheck="false" />
          <div id="docs-body"></div>
          <div id="aux-body" hidden></div>
        </section>
      </div>
      <button id="docs-spine" class="btn-wood" hidden></button>

      <!-- 전투 구석 반투명 ⏸ + 일시정지 팝업(v25-B): 전투 중 Esc도 이 팝업 -->
      <button id="pause-btn" class="px-btn pf-dark" hidden><span aria-hidden="true">⏸</span></button>
      <div id="pause" class="panel lift" hidden role="dialog" aria-modal="true">
        <div class="sheet px-frame">
          <h3 id="pause-title"></h3>
          <div id="pause-list"></div>
        </div>
      </div>

      <!-- 마법진 크게 보기: 세계 속 발밑 마법진을 누르면 -->
      <button id="circle-view" class="lift" hidden><canvas id="circle"></canvas></button>

      <!-- 맺음: 두루마리 -->
      <section id="end" hidden>
        <div id="scroll-wrap" class="lift">
          <div id="scroll" class="sheet px-frame">
            <h2 id="end-title"></h2>
            <div id="end-body">
              <canvas id="end-circle"></canvas>
              <div id="end-side">
                <p id="end-kills"></p>
                <p id="end-runes"></p>
                <p id="end-augs-head"></p>
                <ul id="end-cards"></ul>
                <p id="end-note"></p>
              </div>
            </div>
            <button id="end-again" class="btn-seal" data-snd="press"></button>
          </div>
        </div>
      </section>

      <!-- 작은 판: 설정(제목·거점·일시정지 팝업에서). 맨 아래 "만든 사람" 작은 줄(v16) -->
      <div id="settings" class="panel lift" hidden>
        <div class="sheet px-frame">
          <h3 id="settings-title"></h3>
          <button id="sound" class="btn-wood row"></button>
          <button id="book-side" class="btn-wood row"></button>
          <button id="book-skin" class="btn-wood row" hidden></button>
          <button id="open-all" class="btn-wood row"></button>
          <button id="tour-again" class="btn-wood row"></button>
          <button id="wipe" class="btn-wood row"></button>
          <button id="settings-close" class="btn-wood"></button>
          <p id="credits-line"></p>
        </div>
      </div>
      <!-- 새 게임 경고 · 새 출전 확인(v16): 기본 선택은 취소, Esc도 취소 -->
      <div id="confirm" class="panel lift" hidden role="alertdialog" aria-modal="true">
        <div class="sheet px-frame">
          <h3 id="confirm-title"></h3>
          <p id="confirm-body"></p>
          <div class="confirm-row">
            <button id="confirm-no" class="btn-wood"></button>
            <button id="confirm-yes" class="btn-wood danger"></button>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
